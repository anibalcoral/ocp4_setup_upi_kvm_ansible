[defaults]
timeout=60
host_key_checking=False
action_warnings=False
stdout_callback=ansible.builtin.default
callbacks_enabled=timer, profile_tasks

[callback_default]
result_format=yaml
 
[ssh_connection]
retries=10
ssh_args=-o ControlMaster=auto -o ControlPersist=60s
pipelining=True

[persistent_connection]
command_timeout = 30
